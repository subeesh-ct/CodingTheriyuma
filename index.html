<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodingTheriyuma</title>
    
    <!-- Meta tag for instant redirect (0 seconds) -->
    <meta http-equiv="refresh" content="0; url=https://your-target-website.com">
    
    <script>
        // JavaScript fallback for lightning fast redirect
        window.location.replace("https://your-target-website.com");
    </script>
</head>
<body>
    <p>Loading... If you are not redirected, <a href="https://your-target-website.com">click here</a>.</p>
</body>
</html>
